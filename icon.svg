<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0D47A1"/>
      <stop offset="65%"  stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#64B5F6"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#37474F"/>
      <stop offset="100%" stop-color="#78909C"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="1" y="1" width="62" height="62" rx="8"/>
    </clipPath>
  </defs>

  <!-- Sky background -->
  <rect x="1" y="1" width="62" height="62" rx="8" fill="url(#sky)"/>

  <!-- Cloud -->
  <ellipse cx="32" cy="11" rx="14" ry="6.5" fill="white" opacity="0.93" clip-path="url(#frame)"/>
  <ellipse cx="20" cy="13" rx="9"  ry="5.5" fill="white" opacity="0.93" clip-path="url(#frame)"/>
  <ellipse cx="44" cy="13" rx="9"  ry="5.5" fill="white" opacity="0.93" clip-path="url(#frame)"/>
  <rect x="11" y="11" width="42" height="8" fill="white" opacity="0.93" clip-path="url(#frame)"/>

  <!-- Rain streaks from cloud -->
  <line x1="15" y1="21" x2="12" y2="36" stroke="#90CAF9" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="22" y1="21" x2="19" y2="36" stroke="#90CAF9" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="29" y1="21" x2="26" y2="36" stroke="#90CAF9" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="36" y1="21" x2="33" y2="36" stroke="#90CAF9" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="43" y1="21" x2="40" y2="36" stroke="#90CAF9" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="50" y1="21" x2="47" y2="36" stroke="#90CAF9" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>

  <!-- ── Sky Tower ─────────────────────────────────────────── -->

  <!-- Antenna needle -->
  <rect x="30.5" y="20" width="3" height="11" fill="#ECEFF1" rx="1"/>

  <!-- Observation pod — upper halo/sky-deck ring -->
  <ellipse cx="32" cy="31.5" rx="12" ry="4.5" fill="#546E7A"/>
  <ellipse cx="32" cy="30.5" rx="12" ry="4"   fill="#78909C"/>
  <!-- Highlight stripe across pod -->
  <rect x="20" y="29.5" width="24" height="1.5" fill="#B0BEC5" opacity="0.6" rx="0.5"/>

  <!-- Main concrete shaft -->
  <rect x="30" y="34" width="4" height="13" fill="url(#shaft)"/>

  <!-- Buttress legs (the three Y-shaped supports) -->
  <polygon points="20,58 30,38 30,43" fill="#455A64" clip-path="url(#frame)"/>
  <polygon points="44,58 34,38 34,43" fill="#455A64" clip-path="url(#frame)"/>
  <!-- Central wedge joining legs -->
  <polygon points="24,58 30,44 34,44 40,58" fill="#546E7A" clip-path="url(#frame)"/>

  <!-- Base / SkyCity podium -->
  <rect x="19" y="56" width="26" height="6" fill="#37474F" rx="2" clip-path="url(#frame)"/>
  <!-- Lit windows on podium -->
  <rect x="22" y="57.5" width="3" height="2.5" fill="#80DEEA" rx="0.4" opacity="0.75"/>
  <rect x="27" y="57.5" width="3" height="2.5" fill="#80DEEA" rx="0.4" opacity="0.75"/>
  <rect x="32" y="57.5" width="3" height="2.5" fill="#80DEEA" rx="0.4" opacity="0.75"/>
  <rect x="37" y="57.5" width="3" height="2.5" fill="#80DEEA" rx="0.4" opacity="0.75"/>

  <!-- Ground strip -->
  <rect x="1" y="61.5" width="62" height="1.5" fill="#1B5E20" clip-path="url(#frame)"/>

  <!-- Border frame -->
  <rect x="1" y="1" width="62" height="62" rx="8" fill="none" stroke="#0D47A1" stroke-width="1.5"/>
</svg>
